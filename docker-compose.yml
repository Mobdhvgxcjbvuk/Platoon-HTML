version: '3.8'

services:
  php:
    image: php:8.2-apache
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./uploads:/var/www/html/uploads
    environment:
      - PHP_UPLOAD_MAX_FILESIZE=10M
      - PHP_POST_MAX_SIZE=10M
    command: docker-php-ext-enable-docker-php-extension
    networks:
      - platoon

networks:
  platoon:
    driver: bridge
